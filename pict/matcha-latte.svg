<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title description">
  <title id="title">Es matcha latte</title>
  <desc id="description">Ilustrasi gelas berisi matcha latte dingin berlapis susu.</desc>
  <defs>
