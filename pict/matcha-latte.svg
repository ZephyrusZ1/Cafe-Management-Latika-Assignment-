      <stop offset="0" stop-color="#f2f4df"/>
      <stop offset="1" stop-color="#c5d6a2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#e7f2d9" stop-opacity=".56"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="matcha" x1="0" x2="0" y1="0" y2="1">
